<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Decor | CraftNest</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-leaf"></i>
        </div>

        <div>
            <h1>CraftNest</h1>
            <span>Handmade with LOVE</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="homedecor.html">Home Decor</a>
            <a href="gifts.html">Gift Items</a>
        </nav>

    <section class="products">

        <h2>Home Decor</h2>

        <div class="product-grid">

            <div class="product-card">

                <div class="product-info">
                    <h3>Resin Decor</h3>
                    <p>Beautiful handmade resin decoration.</p>

                    <div class="product-bottom">
                        <span class="price">₹100</span>
                        <button>Add to Cart</button>
                    </div>

            </div>

            <div class="product-card">
                <img src="resin2.jpg" alt="Handmade Decor">

                <div class="product-info">
                    <h3>Handmade Decor</h3>
                    <p>Creative handmade decoration for your home.</p>

                    <div class="product-bottom">
                        <span class="price">₹250</span>
                        <button>Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>
