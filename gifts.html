<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Items | CraftNest</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <i class="fa-solid fa-leaf"></i>
        </div>

        <div>
            <h1>CraftNest</h1>
            <span>Handmade with LOVE</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="homedecor.html">Home Decor</a>
            <a href="gifts.html">Gift Items</a>
        </nav>

    </header>

    <section class="products">

        <h2>Gift Items</h2>

        <div class="product-grid">

            <div class="product-card">

                <img src="resin3.jpg" alt="Resin Keychain">

                <div class="product-info">

                    <h3>Resin Keychain</h3>

                    <p>Beautiful handmade resin keychain.</p>

                    <div class="product-bottom">

                        <span class="price">₹50</span>

                        <button>Add to Cart</button>

                    </div>

                </div>

            </div>


            <div class="product-card">

                <img src="resin4.jpg" alt="Resin Jewellery">

                <div class="product-info">

                    <h3>Resin Jewellery</h3>

                    <p>Beautiful handmade resin jewellery.</p>

                    <div class="product-bottom">

                        <span class="price">₹250</span>

                        <button>Add to Cart</button>

                    </div>

                </div>

            </div>

        </div>

    </section>
<script src="script.js"></script>
</body>
</html>
